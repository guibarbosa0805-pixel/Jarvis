<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Jarvis - Player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #p { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="p"></div>
  <script>
    // Player do YouTube (IFrame API) servido em http://127.0.0.1: o YouTube exige uma página
    // "de verdade" como origem do embed. Controlado pelo app via window.ctl.
    const videoId = new URLSearchParams(location.search).get('v');
    let player = null;
    let lastError = null;

    window.ctl = {
      state: () => ({ ready: !!player, state: player?.getPlayerState?.() ?? -2, error: lastError }),
      pause: () => player?.pauseVideo(),
      play: () => player?.playVideo(),
      volume: (delta) => player?.setVolume(Math.max(0, Math.min(100, player.getVolume() + delta))),
    };

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('p', {
        videoId,
        width: '100%',
        height: '100%',
        playerVars: { autoplay: 1, playsinline: 1, rel: 0, origin: location.origin },
        events: {
          onReady: (e) => e.target.playVideo(),
          onError: (e) => { lastError = e.data; },
        },
      });
    };

    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => { lastError = 'api'; };
    document.head.append(s);
  </script>
</body>
</html>
