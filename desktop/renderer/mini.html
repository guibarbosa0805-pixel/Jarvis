<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self'; script-src 'self'">
  <title>Jarvis</title>
  <link rel="stylesheet" href="mini.css">
</head>
<body>
  <div id="mini" class="mini">
    <button id="orb-btn" class="orb-btn" type="button" title="Ligar/desligar a escuta" aria-label="Ligar ou desligar a escuta">
      <div id="orb" class="orb" data-state="off"><span class="orb-ring"></span><span class="orb-core"></span></div>
    </button>
    <div class="info">
      <div class="top">
        <span id="label" class="label">Jarvis</span>
        <span id="dot" class="dot"></span>
      </div>
      <div id="last" class="last"></div>
    </div>
    <div class="actions">
      <button id="music-btn" class="icon-btn" type="button" aria-label="Pausar a música" hidden>
        <svg id="icon-pause" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
        <svg id="icon-play" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" hidden><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="expand-btn" class="icon-btn" type="button" aria-label="Abrir a janela completa" title="Abrir a janela completa">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M14 3h7v7h-2V6.4l-5.3 5.3-1.4-1.4L17.6 5H14zM5 5h5v2H7v10h10v-3h2v5H5z"/></svg>
      </button>
    </div>
  </div>
  <script src="mini.js"></script>
</body>
</html>
